schema_version: 1
contract_version: 1.1
id: echo-agent
name: EchoAgent
version: 1.1.1
type: runtime
status: active
owner: engineering
responsibility:
  objective: Agent de referencia e diagnostico que encaminha a entrada diretamente ao IA Runtime e retorna a resposta obtida.
  responsibilities:
    - Validar o caminho minimo IAgent -> IA Runtime -> AgentResult.
    - Servir como exemplo simples de agent runtime instanciavel pela AgentFactory atual.
  non_goals:
    - Nao consultar bases de conhecimento.
    - Nao executar tools externas.
    - Nao tomar decisoes de negocio.
    - Nao executar escrita, exportacao ou operacao destrutiva.
  escalation_rules:
    - Escalar para engenharia quando o IA Runtime falhar ou retornar erro de provider.
implementation:
  code_paths:
    - backend/src/BlueprintOS.Core/Agents/EchoAgent.cs
    - backend/src/BlueprintOS.Core/Agents/Contracts/IAgent.cs
    - backend/src/BlueprintOS.Core/Agents/BaseAgent.cs
    - backend/src/BlueprintOS.Core/Agents/AgentFactory.cs
    - backend/src/BlueprintOS.Core/Agents/Observability/IAgentExecutionObserver.cs
  prompt_paths: []
  context_paths:
    - .ai/context/agents.md
    - .ai/context/runtime.md
  runbook_paths: []
  script_paths: []
  docs_paths:
    - docs/agents/Agents.md
  di_registration: null
runtime:
  implemented: true
  interface: BlueprintOS.Core.Agents.Contracts.IAgent
  factory_supported: true
  constructor_dependencies:
    - IAIRuntime
    - IAgentExecutionObserver optional
  dependencies:
    - BlueprintOS.Core.AI.Contracts.IAIRuntime
capabilities:
  tools:
    - IAIRuntime
  allowed_operations:
    - Processar entrada textual via IA Runtime.
    - Retornar resposta textual.
  forbidden_operations:
    - Consultar banco de dados.
    - Executar escrita.
    - Executar operacao destrutiva.
    - Acessar segredos.
capability_ownership:
  ai-runtime-echo:
    responsible_agent_id: echo-agent
    ownership: primary
    delegation_required: true
    direct_execution_by_others_allowed: false
delegation:
  cross_cutting: false
  bypass_allowed: false
  participation_criteria: []
gap_policy:
  direct_bypass_allowed: false
  allow_learning_existing_agent: true
  allow_new_agent_proposal: true
  explicit_human_approval_required_for_new_agent: true
  material_capability_change_requires_human_approval: true
connections:
  profiles: {}
  credential_policy:
    strategy: none
    secret_storage: []
    individual_identity_required: false
    least_privilege: true
    privilege_escalation_allowed: false
    prompt_for_secret_allowed: false
data:
  systems:
    - IA Runtime configurado
  resources:
    - AgentContext.Input
    - AgentResult.Output
  classifications:
    - Unknown
  pii_allowed: false
  sensitive_pii_allowed: false
  secrets_allowed: false
governance:
  read_only: true
  can_propose_write: false
  can_execute_write: false
  can_execute_destructive_operation: false
  policy_engine_required: false
  requires_action_proposal_for:
    - Qualquer evolucao futura que adicione tools, escrita, exportacao material, acesso a dados pessoais ou acesso a segredos.
  approval_required_for: []
  audit_required: false
  default_risk: Green
  enforcement_status: PARTIAL
  by_design_findings:
    - code: AFV2-GOV-001
      classification: BY_DESIGN
      justification: Echo Agent has no write path and no tools; can_execute_write is false and stays false. PARTIAL is the permanent, correct status, not a pending state.
knowledge:
  memory_paths: []
  provenance_labels: []
  update_rules: []
observability:
  logs:
    - System.Diagnostics.DiagnosticListener BlueprintOS.Agents with redacted metadata only.
  metrics: []
  audit_events:
    - agent.execution.started with Agent ID only.
    - agent.execution.completed with Agent ID and outcome only.
    - agent.execution.failed with Agent ID, outcome and fixed failure category only.
  redaction_required: true
tests:
  unit:
    - backend/tests/BlueprintOS.UnitTests/Core/Agents/EchoAgentTests.cs
  integration: []
  safety:
    - backend/tests/BlueprintOS.UnitTests/Core/Agents/EchoAgentSafetyTests.cs
  contract:
    - tools/agents/validate-agent-manifests.js
relationships:
  upstream_agents: []
  downstream_agents: []
  workflows:
    - BlueprintOS.Core.Workflows.WorkflowRunner can execute this Agent when explicitly composed.
  conflicts_with: []
catalog:
  summary: Agent runtime minimo para diagnostico do caminho IA Runtime.
  display_order: 10

# Ambiente Docker de execucao da API (ver ADR-0018 em .ai/DECISIONS.md).
#
# Docker aqui serve apenas para empacotar e executar a API. Nao ha SQL
# Server local: o ambiente oficial de desenvolvimento usa o SQL Server
# corporativo (bancos MAISCOMPRAS e SOMA_DESENV), acessado via VPN,
# configurado via ConnectionStrings:MaisComprasConnection / ErpConnection
# (user-secrets para "dotnet run" ou variavel de ambiente para Docker),
# nunca hardcoded.
#
# O servico "api" pode rodar via este Docker Compose (porta 8080) ou via
# "dotnet run" local (porta 5262/7127, ver launchSettings.json) — em
# ambos os casos apontando para o SQL Server corporativo.
services:

  api:
    image: blueprintos/api:dev
    container_name: blueprintos-api

    build:
      context: ../../
      dockerfile: backend/src/BlueprintOS.Api/Dockerfile

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__MaisComprasConnection: ${ConnectionStrings__MaisComprasConnection}
      ConnectionStrings__ErpConnection: ${ConnectionStrings__ErpConnection}

    networks:
      - blueprintos-network

networks:
  blueprintos-network:
